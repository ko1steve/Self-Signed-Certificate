[OpenSSL]
exe_path=C:\Tools\openssl\openssl.exe
config_path="C:\Tools\openssl\openssl.cnf"

[Keytool]
exe_path=C:\Tools\keytool\keytool.exe

[Root Certificate Private Key]
output="D:\Certificate-Produce\output\ca.key.pem"
length=2048

[Self-Signed Root PEM Certificate]
output="output\ca.cert.pem"
validDays=3650
subject="/C=TW/ST=Taipei/L=Taipei/O=MyOrg/OU=MyUnit/CN=MyRootCA"

[Self-Signed Root CER Certificate]
output="output\ca.cert.cer"

[Server Certificate Private Key]
output="output\server.key.pem"
length=2048

[Server Certificate Sign Request]
output="output\server.csr"
san_cnf_path="san.cnf"

[Server PEM Certificate]
output="output\server.pem"
validDays=825

[Server PEM Full Certificate]
output="output\server_full.pem"

[Server DER Certificate]
output="output\server.cer"

[Server PFX Certificate]
output="output\server.pfx"
password="ImPassword"

[Server JKS Certificate]
output="output\server.jks"